server:
  address: ${SHOPGUARD_BIND_ADDRESS:127.0.0.1}
  port: ${SHOPGUARD_PORT:18084}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SHOPGUARD_SECURE_COOKIE:false}
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: ${SHOPGUARD_DB_URL:jdbc:h2:file:./data/platform/shopguard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
    username: ${SHOPGUARD_DB_USER:sa}
    password: ${SHOPGUARD_DB_PASSWORD:}
  sql:
    init:
      schema-locations: classpath:db/schema.sql,classpath:db/trade-schema.sql,classpath:db/platform-schema.sql,classpath:db/commerce-schema.sql
      mode: always
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 300KB
app:
  model:
    tool-loop-timeout: 90s
platform:
  admin-password: ${SHOPGUARD_ADMIN_PASSWORD:}
  student-password: ${SHOPGUARD_STUDENT_PASSWORD:}
  gateway-url: ${GATEWAY_BASE_URL:http://127.0.0.1:18081}
  gateway-key: ${GATEWAY_API_KEY:}
  model-mode: ${MODEL_MODE:openai}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  vector-store: ${PLATFORM_VECTOR_STORE:qdrant}
  knowledge-threshold: 0.35
management:
  endpoints:
    web:
      exposure:
        include: health
