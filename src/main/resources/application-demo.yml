# 只与 dev 一起使用；不会调用外部模型或生产依赖。
server:
  address: 127.0.0.1
spring:
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 8
      shutdown:
        await-termination: true
        await-termination-period: 5s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  model:
    name: deterministic-demo
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,metrics
